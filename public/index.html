<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PTAgent 家教资源整合平台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-pending">
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="sidebar-head">
        <div class="brand">
          <div class="brand-mark">PT</div>
          <div class="brand-copy">
            <strong>PTAgent</strong>
            <span>家教资源整合</span>
          </div>
        </div>

        <button type="button" class="sidebar-toggle icon-btn" id="sidebarToggle" title="收起导航" aria-label="收起导航">
          <span aria-hidden="true">‹</span>
        </button>
      </div>

      <nav class="nav-list" id="navList"></nav>

      <section class="sidebar-stats" id="statsGrid" aria-label="业务快捷入口"></section>

      <div class="sidebar-footer">
        <div class="sidebar-user" id="sidebarUser" hidden></div>
        <div class="sidebar-actions">
          <button type="button" class="theme-toggle icon-btn" id="themeToggle" title="切换明暗模式" aria-label="切换明暗模式">
            <span id="themeIcon" aria-hidden="true">☾</span>
          </button>
          <button type="button" class="logout-button icon-btn" id="logoutButton" data-action="logout"
            title="退出登录" aria-label="退出登录" hidden>
            <img src="/assets/icons/log-out.svg" alt="" width="20" height="20" aria-hidden="true">
          </button>
        </div>
      </div>
    </aside>
    <div class="sidebar-scrim" id="sidebarScrim" aria-hidden="true"></div>

    <main class="main-content">
      <header class="topbar">
        <button type="button" class="mobile-menu-toggle icon-btn" id="mobileSidebarToggle" title="打开导航" aria-label="打开导航">
          <span aria-hidden="true">☰</span>
        </button>
        <div class="topbar-title">
          <p class="eyebrow">本地演示环境</p>
          <h1 id="pageTitle">需求广场</h1>
        </div>
      </header>

      <section class="signed-out-state" id="signedOutState">
        <div class="signed-out-mark" aria-hidden="true">PT</div>
        <h2>PTAgent</h2>
        <p>家教资源工作台</p>
      </section>

      <section class="focus-strip" id="focusStrip" aria-label="业务看板">
        <article class="focus-card focus-orange">
          <span>撮合效率</span>
          <strong>高匹配申请优先流转</strong>
        </article>
        <article class="focus-card focus-blue">
          <span>教师供给</span>
          <strong>按科目与区域快速定位</strong>
        </article>
        <article class="focus-card focus-green">
          <span>课后质量</span>
          <strong>沉淀记录、评价与审计</strong>
        </article>
      </section>

      <section class="view is-active" id="view-plaza">
        <div class="section-heading">
          <h2>需求广场</h2>
          <div class="toolbar">
            <select id="filterSubject" aria-label="科目筛选"></select>
            <select id="filterGrade" aria-label="年级筛选"></select>
            <select id="filterRegion" aria-label="区域筛选"></select>
            <select id="filterTag" aria-label="资质标签筛选"></select>
            <select id="filterSort" aria-label="排序方式">
              <option value="latest">最新发布</option>
              <option value="distance">距离最近</option>
              <option value="salaryHigh">薪酬最高</option>
              <option value="salaryLow">薪酬最低</option>
              <option value="match">匹配度最高</option>
            </select>
          </div>
        </div>
        <div class="map-settings" aria-label="地图设置">
          <input id="amapKey" autocomplete="off" placeholder="高德 Web Key" aria-label="高德 Web Key">
          <input id="amapSecurityCode" autocomplete="off" placeholder="安全密钥" aria-label="高德安全密钥">
          <button type="button" class="ghost-btn" data-action="save-map-config">启用高德</button>
          <button type="button" class="mini-btn" data-action="clear-map-config">本地地图</button>
        </div>
        <div class="plaza-layout">
          <div class="map-board" id="mapBoard" aria-label="需求位置分布"></div>
          <div class="demand-grid" id="demandGrid"></div>
        </div>
      </section>

      <section class="view" id="view-admin-demands">
        <div class="section-heading">
          <h2>需求发布与管理</h2>
        </div>
        <form class="tool-surface form-grid compact" id="importDemandForm">
          <label>需求 XLSX 路径<input name="filePath" value="example.xlsx" required></label>
          <button type="submit" class="primary-btn" title="导入需求">
            <span aria-hidden="true">↑</span>
            导入 XLSX
          </button>
        </form>
        <form class="tool-surface form-grid" id="demandForm">
          <label>家长姓名<input name="parentName" required value="赵女士"></label>
          <label>联系电话<input name="parentPhone" required value="13900001111"></label>
          <label>微信号<input name="parentWechat" value="zhao-parent"></label>
          <label>区域<select name="region" required id="demandRegion"></select></label>
          <label class="wide">详细地址<input name="address" required value="天河区珠江新城"></label>
          <label>经度<input name="longitude" type="number" step="0.0001" value="113.3245"></label>
          <label>纬度<input name="latitude" type="number" step="0.0001" value="23.1197"></label>
          <label>科目<select name="subject" required id="demandSubject"></select></label>
          <label>年级<select name="grade" required id="demandGrade"></select></label>
          <label>教师性别
            <select name="teacherGender">
              <option value="3">不限</option>
              <option value="1">男教师</option>
              <option value="2">女教师</option>
            </select>
          </label>
          <label>最低薪酬<input name="salaryMin" type="number" value="200"></label>
          <label>最高薪酬<input name="salaryMax" type="number" value="280"></label>
          <label class="wide">基本成绩<input name="basicScore" value="基础中等，希望系统提升"></label>
          <label class="wide">资质标签<select name="qualificationTags" multiple id="demandTags"></select></label>
          <label class="wide">备注<textarea name="remark">每周两次，优先工作日晚间。</textarea></label>
          <div class="check-row wide">
            <label><input type="checkbox" name="is985Required">985</label>
            <label><input type="checkbox" name="is211Required">211</label>
            <label><input type="checkbox" name="isKeyUniversityRequired">重本</label>
          </div>
          <button type="submit" class="primary-btn wide" title="发布需求">
            <span aria-hidden="true">+</span>
            发布需求
          </button>
        </form>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>需求</th><th>区域</th><th>薪酬</th><th>状态</th><th>操作</th></tr>
            </thead>
            <tbody id="adminDemandRows"></tbody>
          </table>
        </div>
      </section>

      <section class="view" id="view-applications">
        <div class="section-heading">
          <h2>申请记录与匹配审核</h2>
        </div>
        <div class="application-list" id="applicationList"></div>
      </section>

      <section class="view" id="view-teachers">
        <div class="section-heading">
          <h2>教师与简历</h2>
        </div>
        <div class="teacher-grid" id="teacherGrid"></div>
        <form class="tool-surface form-grid compact" id="resumeForm">
          <label>教师<select name="teacherId" id="resumeTeacher"></select></label>
          <label>简历文件路径<input name="fileUrl" value="/mock-resumes/new-resume.pdf"></label>
          <label class="wide">简历摘要<textarea name="summary">补充最新教学案例与可授课区域。</textarea></label>
          <button type="submit" class="primary-btn wide" title="投递简历">
            <span aria-hidden="true">↑</span>
            投递简历
          </button>
        </form>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>教师</th><th>摘要</th><th>提交时间</th><th>状态</th><th>操作</th></tr>
            </thead>
            <tbody id="resumeRows"></tbody>
          </table>
        </div>
      </section>

      <section class="view" id="view-courses">
        <div class="section-heading">
          <h2>课程与授课记录</h2>
        </div>
        <div class="order-grid" id="orderGrid"></div>
        <form class="tool-surface form-grid compact" id="recordForm">
          <label>课程订单<select name="orderId" id="recordOrder"></select></label>
          <label>上课日期<input name="lessonDate" type="date"></label>
          <label>课时<input name="lessonDuration" type="number" step="0.5" value="2"></label>
          <label class="wide">授课内容<textarea name="content">完成知识点复盘与题型训练。</textarea></label>
          <label class="wide">学生表现<textarea name="studentPerformance">课堂配合度良好，基础题正确率提升。</textarea></label>
          <label class="wide">教师备注<textarea name="teacherNotes">下节课安排综合测试。</textarea></label>
          <button type="submit" class="primary-btn wide" title="新增记录">
            <span aria-hidden="true">+</span>
            新增授课记录
          </button>
        </form>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>订单</th><th>日期</th><th>课时</th><th>内容</th><th>表现</th></tr>
            </thead>
            <tbody id="recordRows"></tbody>
          </table>
        </div>
      </section>

      <section class="view" id="view-feedbacks">
        <div class="section-heading">
          <h2>评价与回访</h2>
        </div>
        <form class="tool-surface form-grid compact" id="feedbackForm">
          <label>课程订单<select name="orderId" id="feedbackOrder"></select></label>
          <label>评分<input name="ratingScore" type="number" min="1" max="5" value="5"></label>
          <label>来源
            <select name="feedbackSource">
              <option value="1">家长回访</option>
              <option value="2">教师自评</option>
            </select>
          </label>
          <label class="wide">评价内容<textarea name="commentText">家长反馈沟通及时，阶段目标明确。</textarea></label>
          <button type="submit" class="primary-btn wide" title="录入评价">
            <span aria-hidden="true">✓</span>
            录入评价
          </button>
        </form>
        <div class="feedback-list" id="feedbackList"></div>
      </section>

      <section class="view" id="view-audit">
        <div class="section-heading">
          <h2>审计日志</h2>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>时间</th><th>动作</th><th>目标</th><th>操作者</th></tr>
            </thead>
            <tbody id="auditRows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <aside class="insight-panel" id="insightPanel" aria-label="登录侧栏">
      <section class="operator-card">
        <div class="profile-badge" aria-hidden="true">PT</div>
        <div class="current-user" id="currentUser"></div>
        <form class="login-form" id="loginForm">
          <label>
            账号
            <input name="username" autocomplete="username" placeholder="请输入账号" required>
          </label>
          <label>
            密码
            <input name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
          </label>
          <p class="form-error" id="loginError" role="alert" hidden></p>
          <button type="submit" class="primary-btn" title="登录">
            <span aria-hidden="true">→</span>
            登录
          </button>
        </form>
      </section>

      <section class="insight-card">
        <div class="panel-heading">
          <h2>演示账号</h2>
        </div>
        <div class="demo-list" id="demoAccounts"></div>
      </section>

      <section class="insight-card">
        <div class="panel-heading">
          <h2>最新通知</h2>
        </div>
        <div class="notifications" id="notifications"></div>
      </section>

      <section class="insight-card compact-insight">
        <div class="panel-heading">
          <h2>今日节奏</h2>
        </div>
        <ul class="rhythm-list">
          <li><span>1</span>发布需求后先看匹配度</li>
          <li><span>2</span>教师申请由最高管理员审核</li>
          <li><span>3</span>成单后沉淀授课记录与评价</li>
        </ul>
      </section>
    </aside>
  </div>

  <dialog id="applyDialog">
    <form method="dialog" id="applyForm">
      <div class="dialog-head">
        <h2 id="applyTitle">申请接单</h2>
        <button type="button" class="icon-btn" id="closeApply" title="关闭">×</button>
      </div>
      <textarea name="selfIntro">我有相关科目经验，可按学生基础制定阶段计划，并每周反馈进度。</textarea>
      <menu>
        <button type="button" class="ghost-btn" id="cancelApply">取消</button>
        <button type="submit" class="primary-btn">
          <span aria-hidden="true">→</span>
          提交申请
        </button>
      </menu>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
